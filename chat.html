<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f5f5f5;
            position: relative;
        }

        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            text-decoration: none;
            color: #333;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 5px;
            z-index: 10;
        }

        .back-button:hover {
            color: #000;
        }

        .chat-container {
            display: flex;
            height: calc(100vh - 40px);
            margin-top: 40px;
        }

        .sidebar {
            width: 30%;
            background-color: #fff;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            background-color: #007bff;
            color: white;
            font-weight: bold;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
        }

        .chat-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-item:hover {
            background-color: #f8f9fa;
        }

        .chat-item.active {
            background-color: #e3f2fd;
        }

        .chat-avatar {
            width: 40px;
            height: 40px;
            background-color: #007bff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .chat-info h4 {
            margin: 0;
            font-size: 16px;
        }

        .chat-info p {
            margin: 5px 0 0 0;
            font-size: 14px;
            color: #666;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 20px;
            background-color: #fff;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
        }

        .message.sent {
            justify-content: flex-end;
        }

        .message.received {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.sent .message-content {
            background-color: #007bff;
            color: white;
        }

        .message.received .message-content {
            background-color: #fff;
            color: #333;
            border: 1px solid #ddd;
        }

        .message-input {
            padding: 20px;
            background-color: #fff;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 10px;
        }

        .message-input input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
        }

        .message-input button {
            padding: 12px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
        }

        .message-input button:hover {
            background-color: #0056b3;
        }

        @media (max-width: 768px) {
            .chat-container {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: 30%;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-button"><i class="fas fa-arrow-left"></i> Back</a>
    <div class="chat-container">
        <div class="sidebar">
            <div class="sidebar-header">Chats</div>
            <div class="chat-list">
                <div class="chat-item active" onclick="selectChat('Alice')">
                    <div class="chat-avatar">A</div>
                    <div class="chat-info">
                        <h4>Alice</h4>
                        <p>Hey, how are you?</p>
                    </div>
                </div>
                <div class="chat-item" onclick="selectChat('Bob')">
                    <div class="chat-avatar">B</div>
                    <div class="chat-info">
                        <h4>Bob</h4>
                        <p>See you later!</p>
                    </div>
                </div>
                <div class="chat-item" onclick="selectChat('Charlie')">
                    <div class="chat-avatar">C</div>
                    <div class="chat-info">
                        <h4>Charlie</h4>
                        <p>Thanks for the help!</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="chat-area">
            <div class="chat-header">
                <div class="chat-avatar">A</div>
                <h4 id="chatName">Alice</h4>
            </div>
            <div class="chat-messages" id="messages">
                <div class="message received">
                    <div class="message-content">Hi there! How are you doing today?</div>
                </div>
                <div class="message sent">
                    <div class="message-content">I'm doing great, thanks! How about you?</div>
                </div>
                <div class="message received">
                    <div class="message-content">I'm good too. What are you up to?</div>
                </div>
            </div>
            <div class="message-input">
                <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        let currentChat = 'Alice';
        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');

        function selectChat(name) {
            currentChat = name;
            document.getElementById('chatName').textContent = name;
            document.querySelectorAll('.chat-item').forEach(item => item.classList.remove('active'));
            event.currentTarget.classList.add('active');
            // In a real app, you'd load messages for this chat
            messagesContainer.innerHTML = `
                <div class="message received">
                    <div class="message-content">Hi! This is ${name}. How can I help you?</div>
                </div>
            `;
        }

        function sendMessage() {
            const message = messageInput.value.trim();
            if (message) {
                const messageElement = document.createElement('div');
                messageElement.className = 'message sent';
                messageElement.innerHTML = `<div class="message-content">${message}</div>`;
                messagesContainer.appendChild(messageElement);
                messageInput.value = '';
                messagesContainer.scrollTop = messagesContainer.scrollHeight;

                // Simulate a response after 1 second
                setTimeout(() => {
                    const responseElement = document.createElement('div');
                    responseElement.className = 'message received';
                    responseElement.innerHTML = `<div class="message-content">Thanks for your message! This is a demo response.</div>`;
                    messagesContainer.appendChild(responseElement);
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }, 1000);
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
